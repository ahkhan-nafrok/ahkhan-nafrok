name: Update Profile Assets

# Runs independently of the existing profile-3d-contrib workflow —
# this one only touches files under assets/cards/ and assets/dividers/,
# so the two jobs never write to the same paths.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # manual "Run workflow" button
  push:
    paths:
      - "scripts/generate_assets.py"
      - "assets/projects/**"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest activity (optional context for future use)
        id: activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/users/${{ github.repository_owner }}/events/public" \
            --jq '[.[] | select(.type=="PushEvent")][0].repo.name // "no recent push"' \
            > /tmp/latest_activity.txt || echo "no recent push" > /tmp/latest_activity.txt
          echo "latest=$(cat /tmp/latest_activity.txt)" >> "$GITHUB_OUTPUT"

      - name: Regenerate SVG assets
        run: python3 scripts/generate_assets.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cards assets/dividers
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate profile assets [skip ci]"
            git push
          else
            echo "No asset changes to commit."
          fi
