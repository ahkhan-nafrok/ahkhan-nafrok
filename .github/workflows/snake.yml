name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG (stone theme)
        uses: Platane/snk@v3
        with:
          github_user_name: ahkhan-nafrok
          outputs: |
            assets/snake/contribution-snake.svg?color_snake=%23e7e5e4&color_dots=1c1917,44403c,57534e,78716c,a8a29e&color_empty=%230c0a09
            assets/snake/contribution-snake.gif?color_snake=%23e7e5e4&color_dots=1c1917,44403c,57534e,78716c,a8a29e&color_empty=%230c0a09

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          git diff --cached --quiet || (git commit -m "chore: update contribution snake [skip ci]" && git push)
